<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA fallback: redirect 404 to index.html with hash
    // Preserva o path original como hash para o router do app
    var path = window.location.pathname + window.location.search;
    window.location.replace('/' + 'index.html#' + encodeURIComponent(path));
  </script>
</head>
<body>
  Redirecionando para o app... <a href="/index.html">Clique aqui se não redirecionar</a>
</body>
</html>
