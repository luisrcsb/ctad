<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTAD — Site movido para o GitHub Pages</title>

    <!-- Redirecionamento imediato (funciona sem JavaScript) -->
    <meta http-equiv="refresh" content="0; url=https://luisrcsb.github.io/ctad/">

    <!-- Redirecionamento via JS (substitui o histórico: volta não volta pra cá) -->
    <script>
        window.location.replace("https://luisrcsb.github.io/ctad/");
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 24px;
        }
        main { max-width: 480px; }
        h1 { font-size: 1.4rem; margin-bottom: 12px; color: #ffd859; }
        p { font-size: 1rem; line-height: 1.6; margin-bottom: 8px; color: #a8b3c0; }
        a {
            color: #58a6ff;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }
        a:hover { border-bottom-color: #58a6ff; }
        .carimbo { margin-top: 20px; font-size: 0.75rem; color: #6e7681; }
    </style>
</head>
<body>
    <main>
        <h1>🏎️ O CTAD mudou de endereço</h1>
        <p>Este site agora é publicado no GitHub Pages.</p>
        <p>Se o redirecionamento automático não iniciar, acesse:</p>
        <p><a href="https://luisrcsb.github.io/ctad/">👉 luisrcsb.github.io/ctad</a></p>
        <div class="carimbo">krathus-telemetria.web.app → luisrcsb.github.io/ctad</div>
    </main>
</body>
</html>
