<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krathus Racing - Gestão de Compras Coletivas</title>
  <style>
    :root {
      --bg-main: #09090b;
      --bg-card: #121214;
      --bg-card-hover: #18181b;
      --border-color: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Cards de Compras Coletivas */
    .compra-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .compra-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .compra-titulo {
      font-size: 1rem;
      font-weight: 600;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .badge.andamento {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-yellow);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .acoes-card {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn-acao {
      background: #27272a;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-acao:hover {
      background: #3f3f46;
    }

    .btn-resumir {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .btn-resumir:hover {
      background: rgba(16, 185, 129, 0.25);
    }

    .progress-container {
      margin-top: 15px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      background: var(--border-color);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--accent-green);
      height: 100%;
      border-radius: 3px;
    }

    /* Modal Customizado */
    .ctad-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      backdrop-filter: blur(4px);
    }

    .ctad-modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 580px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .ctad-modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ctad-modal-header h3 {
      font-size: 1.1rem;
      color: var(--accent-green);
    }

    .ctad-modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .ctad-modal-body {
      padding: 20px;
      overflow-y: auto;
      max-height: 60vh;
    }

    .resumo-metricas {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .participante-item {
      background: var(--bg-card-hover);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .participante-header {
      display: flex;
      justify-content: space-between;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .status-pago {
      color: var(--accent-green);
    }

    .status-pendente {
      color: var(--accent-red);
    }

    .pix-box {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .pix-qr-container {
      background: #ffffff;
      padding: 8px;
      border-radius: 6px;
    }

    .pix-qr-container img {
      width: 110px;
      height: 110px;
      display: block;
    }

    .pix-input-group {
      width: 100%;
      display: flex;
      gap: 6px;
    }

    .pix-input {
      flex: 1;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      text-align: center;
    }

    .btn-copiar {
      background: #27272a;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-copiar:hover {
      background: #3f3f46;
    }

    .ctad-modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
    }

    .ctad-btn-fechar {
      background: #27272a;
      color: var(--text-main);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .ctad-btn-fechar:hover {
      background: #3f3f46;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>KRATHUS RACING</h1>
      <p>Gestão de Compras Coletivas</p>
    </header>

    <div class="section-title">🛒 Compras Coletivas Cadastradas</div>

    <!-- Exemplo do Card idêntico ao da tela -->
    <div class="compra-card">
      <div class="compra-header">
        <span class="compra-titulo">🛒 Pneu de corrida + Roda de metal WLtoys 1/28</span>
        <span class="badge andamento">EM ANDAMENTO / PENDENTE</span>
      </div>

      <div class="acoes-card">
        <button class="btn-acao btn-resumir" onclick="abrirResumoCompra(compraExemplo)">Resumir</button>
        <button class="btn-acao">Rastreio: NN374569092BR</button>
        <button class="btn-acao">Gerenciar</button>
      </div>

      <div class="progress-container">
        <div class="progress-info">
          <span>STATUS DE PAGAMENTOS (3/4)</span>
          <span>75%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: 75%;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Estrutura do Modal -->
  <div id="modalResumo" class="ctad-modal-overlay" style="display: none;">
    <div class="ctad-modal-content">
      <div class="ctad-modal-header">
        <h3 id="modalTitulo">Resumo da Compra Coletiva</h3>
        <button onclick="fecharModalResumo()" class="ctad-modal-close">&times;</button>
      </div>
      <div class="ctad-modal-body" id="modalCorpo">
        <!-- Conteúdo injetado via JavaScript -->
      </div>
      <div class="ctad-modal-footer">
        <button onclick="fecharModalResumo()" class="ctad-btn-fechar">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    // Objeto de dados espelhado na compra da sua tela
    const compraExemplo = {
      nome: "Pneu de corrida + Roda de metal WLtoys 1/28",
      status: "Em Andamento / Pendente",
      rastreio: "NN374569092BR",
      participantes: [
        { nome: "DJ Edgard", valor: 50.70, pago: true },
        { nome: "Gustavo", valor: 50.70, pago: false },
        { nome: "Henrique", valor: 50.70, pago: false },
        { nome: "Raphael", valor: 81.39, pago: true },
        { nome: "Ronaldo", valor: 50.70, pago: true }
      ]
    };

    function abrirResumoCompra(compra) {
      // 1. Número de pessoas participantes deve ser igual ao número de pessoas marcadas
      const totalParticipantes = compra.participantes.length;
      
      // 2. Lista de devedores extraída apenas dos que NÃO estiverem marcados como pagadores
      const devedores = compra.participantes.filter(p => !p.pago);

      document.getElementById('modalTitulo').innerText = `Resumo: ${compra.nome}`;

      let htmlContent = `
        <div class="resumo-metricas">
          <div><strong>Rastreio:</strong> ${compra.rastreio || 'N/A'}</div>
          <div><strong>Total Participantes:</strong> ${totalParticipantes}</div>
          <div><strong>Pagos:</strong> ${compra.participantes.filter(p => p.pago).length}</div>
          <div><strong>Pendentes (Devedores):</strong> ${devedores.length}</div>
        </div>
        <h4 style="margin-bottom: 12px; font-size: 0.95rem; color: var(--text-main);">Detalhamento dos Participantes:</h4>
      `;

      compra.participantes.forEach(p => {
        const statusBadge = p.pago 
          ? '<span class="status-pago">Pago ✅</span>' 
          : '<span class="status-pendente">Pendente ❌</span>';

        htmlContent += `
          <div class="participante-item">
            <div class="participante-header">
              <span>${p.nome} - R$ ${p.valor.toFixed(2)}</span>
              <span>${statusBadge}</span>
            </div>
        `;

        // 3. Exibir QR Code com o Pix APENAS para os que estiverem marcados como não pagadores
        if (!p.pago) {
          // Payload Pix simulado para demonstração (substitua pela sua chave/payload real)
          const payloadPix = `00020126580014br.gov.bcb.pix0136sua-chave-pix-aqui5204000053039865802BR5913KrathusRacing6009Maceio62070503***6304`;
          const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(payloadPix)}`;

          htmlContent += `
            <div class="pix-box">
              <span style="font-size: 0.8rem; color: var(--text-muted);">QR Code Pix para Pagamento Pendente:</span>
              <div class="pix-qr-container">
                <img src="${qrCodeUrl}" alt="QR Code Pix">
              </div>
              <div class="pix-input-group">
                <input type="text" readonly class="pix-input" id="pix-${p.nome.replace(/\s+/g, '')}" value="${payloadPix}">
                <button class="btn-copiar" onclick="copiarPix('pix-${p.nome.replace(/\s+/g, '')}')">Copiar</button>
              </div>
            </div>
          `;
        }

        htmlContent += `</div>`;
      });

      document.getElementById('modalCorpo').innerHTML = htmlContent;
      document.getElementById('modalResumo').style.display = 'flex';
    }

    function fecharModalResumo() {
      document.getElementById('modalResumo').style.display = 'none';
    }

    function copiarPix(elementId) {
      const input = document.getElementById(elementId);
      input.select();
      input.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(input.value);
      alert('Chave Pix Copia e Cola copiada com sucesso!');
    }

    // Fechar modal clicando fora do conteúdo
    window.onclick = function(event) {
      const modal = document.getElementById('modalResumo');
      if (event.target == modal) {
        fecharModalResumo();
      }
    }
  </script>
</body>
</html>
